<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <link rel="stylesheet" href="design-system/design-tokens.css">
    <link rel="stylesheet" href="css/styles.css">
    <title>Live2D桌宠与语音聊天</title>
</head>
<body>
    <canvas id="canvas"></canvas>

    <div id="state-chip" role="status"></div>
    <div class="vision-bracket" aria-hidden="true"></div>
    <div id="state-live" aria-live="polite" class="sr-only"></div>

    <div id="subtitle-container">
        <p id="subtitle-text"></p>

        <div id="subtitle-page">
            <span id="subtitle-page-num"></span>
            <span id="subtitle-page-dots"></span>
        </div>
    </div>

    <div id="text-input-bar">
        <input id="text-input" type="text" autocomplete="off" spellcheck="false"
               placeholder="说点什么…（Ctrl+T 隐藏）" />
        <button id="text-send" type="button">发送</button>
    </div>

    <script src="vendor/live2dcubismcore.min.js"></script>
    <script src="vendor/live2d.min.js"></script>
    <script src="vendor/pixi.min.js"></script>
    <script src="vendor/pixi-live2d-display.js"></script>
    <script src="vendor/pixi-live2d-display-extra.js"></script>
    <script src="js/state-visual.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
