<!doctype html>
<meta charset="utf-8">
<title>Neuro - Your name</title>

<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background:
      radial-gradient(600px 300px at 85% -10%, rgba(63,83,142,.20), transparent 65%),
      linear-gradient(180deg, #0e1414, #0a0f0f 70%, #0c1113);
    color: #cfdbdb;
    font: 13px/1.65 "Bahnschrift", "Segoe UI", "Microsoft YaHei", sans-serif;
    letter-spacing: .3px;
    display: flex; flex-direction: column; justify-content: center;
    padding: 26px 28px; user-select: none;
    border: 1px solid rgba(90,110,140,.28);
  }
  h1 { font-size: 15px; font-weight: 600; color: #dfe8ea; letter-spacing: .6px; }
  .hint { margin-top: 5px; font-size: 11.5px; color: #6f8183; }
  input {
    margin-top: 16px; width: 100%; padding: 9px 11px;
    background: rgba(18,26,28,.92); color: #e6f0f0;
    border: 1px solid rgba(90,110,140,.34); border-radius: 5px;
    font: inherit; font-size: 13.5px; outline: none;
  }
  input:focus { border-color: rgba(120,150,200,.62); box-shadow: 0 0 0 2px rgba(63,83,142,.20); }
  .row { display: flex; gap: 9px; justify-content: flex-end; margin-top: 16px; }
  button {
    font: inherit; font-size: 12px; padding: 7px 18px; border-radius: 5px;
    border: 1px solid rgba(90,110,140,.34); background: transparent;
    color: #9db0b2; cursor: pointer; transition: .14s;
  }
  button:hover { border-color: rgba(120,150,200,.6); color: #dbe7e9; }
  button.primary { background: rgba(63,83,142,.34); border-color: rgba(110,140,190,.5); color: #e8f1f4; }
  button.primary:hover { background: rgba(63,83,142,.5); }
  .err { margin-top: 8px; min-height: 15px; font-size: 11px; color: #c98989; }
</style>

<h1>What should she call you?</h1>
<div class="hint">She keeps this name in memory and uses it from now on.</div>

<input id="name" maxlength="24" placeholder="Your name" spellcheck="false" autocomplete="off">

<div class="row">
  <button id="skip">Later</button>
  <button id="save" class="primary">Save</button>
</div>
<div class="err" id="err"></div>

<script>
const { ipcRenderer } = require('electron');
const input = document.getElementById('name');
const err = document.getElementById('err');

function submit() {
    const v = input.value.replace(/\s+/g, ' ').trim();
    if (!v) { err.textContent = 'Type a name, or press Later.'; input.focus(); return; }
    if (v.length > 24) { err.textContent = 'Keep it under 24 characters.'; return; }
    ipcRenderer.send('save-user-name', v);
}

document.getElementById('save').addEventListener('click', submit);
document.getElementById('skip').addEventListener('click', () => ipcRenderer.send('close-name-window'));
input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') { e.preventDefault(); submit(); }
    if (e.key === 'Escape') { e.preventDefault(); ipcRenderer.send('close-name-window'); }
});

ipcRenderer.on('prefill-name', (_e, v) => {
    input.value = v || '';
    input.focus();
    input.select();
});

window.addEventListener('DOMContentLoaded', () => { input.focus(); });
</script>
